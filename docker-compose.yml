services:
  clash:
    profiles: ["proxy"]
    build:
      context: ./docker
      dockerfile: clash.Dockerfile
    restart: unless-stopped
    env_file:
      - ${SECRETS_DIR:?Set SECRETS_DIR to solver-secrets path}/.env
    volumes:
      - ${SECRETS_DIR}/clash:/clash-work
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:7890 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 15s

  pipeline:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${SOLVER_IMAGE:-solver-pipeline:latest}
    depends_on:
      clash:
        condition: service_healthy
        required: false
    env_file:
      - ${SECRETS_DIR:?Set SECRETS_DIR}/.env
    environment:
      HF_REPO_ID: ${HF_REPO_ID:-}
      HUGGINGFACE_HUB_TOKEN: ${HF_TOKEN:-}
    volumes:
      - ./results:/app/results
    # 示例: ./scripts/run-pipeline.sh 1-20
